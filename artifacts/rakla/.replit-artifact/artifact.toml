kind = "web"
previewPath = "/"
title = "ركلة | RAKLA"
description = "A premium bilingual Kuwaiti football store powered by Next.js and MongoDB Atlas, with secure accounts, owner-only orders, browser cart and favorites, and a teacher brand board."
version = "1.0.0"
id = "artifacts/rakla"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21932

[services.development]
run = "pnpm --filter @workspace/rakla run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rakla", "run", "build" ]
run = "pnpm --filter @workspace/rakla run start"

[services.env]
PORT = "21932"
BASE_PATH = "/"
