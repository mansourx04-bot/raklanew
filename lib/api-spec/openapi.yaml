openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: RAKLA MongoDB products, JWT accounts and protected orders
servers:
  - url: /api
tags:
  - name: health
  - name: products
  - name: auth
  - name: orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products from MongoDB
      responses:
        "200":
          description: Product catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created and session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in and session cookie issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Clear the current session cookie
      responses:
        "200":
          description: Session cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /orders:
    get:
      operationId: getMyOrders
      tags: [orders]
      summary: List only the current user's orders
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order for the current user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get one owned order
      security:
        - sessionCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The authenticated user's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Order belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rakla_session
  responses:
    Unauthorized:
      description: A valid session cookie is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: MongoDB Atlas is not configured or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    BiText:
      type: object
      required: [ar, en]
      properties:
        ar:
          type: string
        en:
          type: string
    Product:
      type: object
      required: [id, name, category, desc, price, rating, reviews, surfaces, sizes, image]
      properties:
        id:
          type: string
        name:
          $ref: "#/components/schemas/BiText"
        category:
          type: string
          enum: [boots, balls, gk, wear, accessories, training]
        desc:
          $ref: "#/components/schemas/BiText"
        price:
          type: number
        oldPrice:
          type: ["number", "null"]
        rating:
          type: number
        reviews:
          type: integer
        tag:
          type: ["string", "null"]
          enum: [new, best, null]
        surfaces:
          type: array
          items:
            type: string
            enum: [FG, AG, TF, IN]
        sizes:
          type: array
          items:
            type: string
        image:
          type: string
    User:
      type: object
      required: [id, displayName, email, createdAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    SignUpInput:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 60
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    LogoutResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    OrderItemInput:
      type: object
      required: [productId, size, quantity]
      properties:
        productId:
          type: string
        size:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 20
    OrderInput:
      type: object
      required: [customerName, phone, area, paymentMethod, items]
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 8
          maxLength: 20
        area:
          type: string
          minLength: 1
          maxLength: 100
        paymentMethod:
          type: string
          enum: [cod, knet, card, apple]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderItem:
      type: object
      required: [productId, name, size, quantity, price]
      properties:
        productId:
          type: string
        name:
          $ref: "#/components/schemas/BiText"
        size:
          type: string
        quantity:
          type: integer
        price:
          type: number
    Order:
      type: object
      required: [id, userId, orderNumber, items, subtotal, delivery, total, customerName, phone, area, paymentMethod, status, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        orderNumber:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        delivery:
          type: number
        total:
          type: number
        customerName:
          type: string
        phone:
          type: string
        area:
          type: string
        paymentMethod:
          type: string
        status:
          type: string
          enum: [pending, paid]
        createdAt:
          type: string
          format: date-time
